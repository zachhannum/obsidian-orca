name: shots

# The pictures on the docs site are photographs of real Obsidian, so a
# change to a surface, to the site's colors, to the sample book or to an
# example of a mark takes new ones. The reels on the landing page play
# frames of real Obsidian too, so they are taken again with them.
on:
  pull_request:
    paths:
      - "src/**"
      - "styles.css"
      - "e2e/**"
      - "site/sample/**"
      - "site/src/marks/**"
      - "site/src/styles/tokens.css"
      - ".github/workflows/shots.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "styles.css"
      - "e2e/**"
      - "site/sample/**"
      - "site/src/marks/**"
      - "site/src/styles/tokens.css"
      - ".github/workflows/shots.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spec:
    name: take the screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/obsidian-setup
      - run: npm run shots
      # A run that changed no picture still hands on an archive, empty.
      - name: keep the pictures that changed
        run: git ls-files -m -o --exclude-standard -z site/src/shots | tar --null -T - -cf ${{ runner.temp }}/spec.tar
      - uses: actions/upload-artifact@v4
        with:
          name: shots-spec
          path: ${{ runner.temp }}/spec.tar
          retention-days: 1

  reel:
    name: take the reels' frames
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/obsidian-setup
      - run: xvfb-run -a npm run reel
      - name: keep the frames that changed
        run: git ls-files -m -o --exclude-standard -z site/src/shots | tar --null -T - -cf ${{ runner.temp }}/reel.tar
      - uses: actions/upload-artifact@v4
        with:
          name: shots-reel
          path: ${{ runner.temp }}/reel.tar
          retention-days: 1

  shots:
    name: collect the pictures
    needs: [spec, reel]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          pattern: shots-*
          path: ${{ runner.temp }}/parts

      - name: put the pictures in place
        run: |
          for tar in "$RUNNER_TEMP"/parts/*/*.tar; do
            tar -xf "$tar"
          done

      - name: list the pictures that moved
        run: |
          {
            echo "## Pictures that moved"
            echo
            moved="$(git status --porcelain site/src/shots)"
            if [ -z "$moved" ]; then
              echo "None."
            else
              echo '```'
              echo "$moved"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: shots
          path: site/src/shots/
          retention-days: 7

      # A picture is rasterized by the machine that took it, so the ones
      # in the repo are the ones this job takes. On main it opens a pull
      # request with whatever changed rather than writing to the branch.
      - name: open a pull request with the new pictures
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain site/src/shots)" ]; then
            echo "the pictures are unchanged"
            exit 0
          fi
          # One branch for every run, so a run before the last pictures
          # merge replaces them in the open pull request.
          branch="shots/refresh"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add site/src/shots
          git commit -m "Take the site's pictures again"
          git push --force origin "$branch"
          gh pr view "$branch" --json state -q .state 2>/dev/null | grep -qx OPEN || gh pr create --base main --head "$branch" \
            --title "Take the site's pictures again" \
            --body "The screenshot spec took new pictures of ${GITHUB_SHA::7}."

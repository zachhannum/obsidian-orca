name: shots

# The pictures on the docs site are photographs of real Obsidian, so a
# change to a surface, to the site's colors, to the sample book or to an
# example of a mark takes new ones. The loop on the landing page is
# played from frames of real Obsidian too, so it is taken again with them.
on:
  pull_request:
    paths:
      - "src/**"
      - "styles.css"
      - "e2e/**"
      - "site/sample/**"
      - "site/src/marks/**"
      - "site/src/styles/tokens.css"
      - ".github/workflows/shots.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "styles.css"
      - "e2e/**"
      - "site/sample/**"
      - "site/src/marks/**"
      - "site/src/styles/tokens.css"
      - ".github/workflows/shots.yml"

# The commit of orca-film that draws the loop. A change there reaches
# the site when this moves.
env:
  ORCA_FILM_REF: fbf33766b11a478a1b6e5d20166dae4fb5c003fa

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spec:
    name: take the screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/obsidian-setup
      - run: xvfb-run -a npm run shots
      - name: keep the pictures that changed
        run: git ls-files -m -o --exclude-standard -z site/src/shots | xargs -0 tar -cf ${{ runner.temp }}/spec.tar
      - uses: actions/upload-artifact@v4
        with:
          name: shots-spec
          path: ${{ runner.temp }}/spec.tar
          retention-days: 1

  frames:
    name: take the loop's frames
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/obsidian-setup
      - name: take the loop's frames
        run: xvfb-run -a npm run film
        env:
          ORCA_FILM_OUT: ${{ github.workspace }}/frames
      - uses: actions/upload-artifact@v4
        with:
          name: shots-frames
          path: frames/
          retention-days: 1

  loop:
    name: render the loop
    needs: frames
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        with:
          repository: zachhannum/orca-film
          ref: ${{ env.ORCA_FILM_REF }}
          path: film

      - uses: actions/download-artifact@v5
        with:
          name: shots-frames
          path: film/assets

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # The render takes minutes, so a pull request takes the posters
      # alone. The frames are where a change to a surface breaks the film
      # spec, and they run either way.
      - name: render the loop
        working-directory: film
        run: |
          npm ci --prefer-offline --no-audit --no-fund
          npx playwright install --with-deps chromium
          if [ "$GITHUB_REF" = refs/heads/main ] && [ "$GITHUB_EVENT_NAME" = push ]; then
            node loop.mjs --into ../site/src/shots
          else
            node loop.mjs --posters --into ../site/src/shots
          fi

      - name: keep the pictures that changed
        run: git ls-files -m -o --exclude-standard -z site/src/shots | xargs -0 tar -cf ${{ runner.temp }}/loop.tar
      - uses: actions/upload-artifact@v4
        with:
          name: shots-loop
          path: ${{ runner.temp }}/loop.tar
          retention-days: 1

  shots:
    name: collect the pictures
    needs: [spec, loop]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          pattern: shots-*
          exclude: shots-frames
          path: ${{ runner.temp }}/parts

      - name: put the pictures in place
        run: |
          for tar in "$RUNNER_TEMP"/parts/*/*.tar; do
            tar -xf "$tar"
          done

      - name: list the pictures that moved
        run: |
          {
            echo "## Pictures that moved"
            echo
            moved="$(git status --porcelain site/src/shots)"
            if [ -z "$moved" ]; then
              echo "None."
            else
              echo '```'
              echo "$moved"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: shots
          path: site/src/shots/
          retention-days: 7

      # A picture is rasterized by the machine that took it, so the ones
      # in the repo are the ones this job takes. On main it opens a pull
      # request with whatever changed rather than writing to the branch.
      - name: open a pull request with the new pictures
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain site/src/shots)" ]; then
            echo "the pictures are unchanged"
            exit 0
          fi
          # One branch for every run, so a run before the last pictures
          # merge replaces them in the open pull request.
          branch="shots/refresh"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add site/src/shots
          git commit -m "Take the site's pictures again"
          git push --force origin "$branch"
          gh pr view "$branch" --json state -q .state 2>/dev/null | grep -qx OPEN || gh pr create --base main --head "$branch" \
            --title "Take the site's pictures again" \
            --body "The screenshot spec took new pictures of ${GITHUB_SHA::7}."

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: type check, lint, tests, bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # The version the bundle targets, so a test that only passes on a
      # newer one fails here.
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      # The audit and the metadata refresh are registry round trips this
      # job has no use for, and they cost minutes over a warm cache.
      - run: npm ci --prefer-offline --no-audit --no-fund

      - run: npm run typecheck

      - run: npm run lint

      # The Node tier exports the sample book and the fixture book, and
      # reads the structure and the words of each PDF.
      - run: sudo apt-get update && sudo apt-get install -y qpdf poppler-utils

      - run: npm test

      - run: npm run build

      # Local Linker installs a PR's build from this artifact, so a
      # change can be tried in a vault or on a phone before it merges.
      - uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: |
            main.js
            manifest.json
            styles.css
          if-no-files-found: error

  e2e:
    name: e2e on ${{ matrix.os }} (${{ matrix.shard }}/4)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # An account runs five macOS jobs at a time, and open PRs
        # would share them. Only a push to main runs the suite on macOS.
        os: ${{ fromJSON(github.event_name == 'push' && '["ubuntu-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
        # A shard is a runner with an Obsidian of its own, and it runs
        # a quarter of the spec files.
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - run: npm ci --prefer-offline --no-audit --no-fund

      # The app and its installer are each a download. The version is
      # pinned in the harness, so the key moves when the pin does.
      - uses: actions/cache@v4
        with:
          path: ~/.obsidian-cache
          key: obsidian-${{ runner.os }}-${{ hashFiles('e2e/harness/launch.ts') }}

      # Electron needs the libraries Chromium needs, and Playwright
      # keeps that list.
      - name: system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          npx playwright install-deps chromium
          sudo apt-get install -y xvfb

      # A spec reads the fonts an exported PDF embeds with pdffonts.
      - name: PDF tools
        if: runner.os == 'Linux'
        run: sudo apt-get install -y qpdf poppler-utils

      - name: PDF tools
        if: runner.os == 'macOS'
        run: brew install qpdf poppler

      - name: e2e
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run e2e -- --shard=${{ matrix.shard }}/4

      - name: e2e
        if: runner.os == 'macOS'
        run: npm run e2e -- --shard=${{ matrix.shard }}/4

      # The report carries the traces and screenshots the specs
      # attached, so a failure needs nothing else kept.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: e2e-report-${{ matrix.os }}-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

  # Main's ruleset requires a check with this name on each platform,
  # and a shard's name carries its number. This job is that check. A
  # PR runs no macOS shard, so its macOS check passes with none.
  e2e-all:
    name: e2e on ${{ matrix.os }}
    needs: e2e
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      # `needs.e2e.result` is one answer for both platforms, so the
      # shards of this platform are counted from the run's own jobs.
      - name: every shard passed
        env:
          GH_TOKEN: ${{ github.token }}
          JOBS: repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs
          SHARD: "e2e on ${{ matrix.os }} ("
          SHARDS: ${{ (matrix.os == 'ubuntu-latest' || github.event_name == 'push') && 4 || 0 }}
        run: |
          passed=$(gh api "$JOBS?per_page=100" --jq '[.jobs[] | select(.name | startswith(env.SHARD)) | select(.conclusion == "success")] | length')
          echo "$passed of $SHARDS shards passed"
          [ "$passed" = "$SHARDS" ]

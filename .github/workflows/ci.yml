name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: type check, tests, bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # The version the bundle targets, so a test that only passes on a
      # newer one fails here.
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      # The audit and the metadata refresh are registry round trips this
      # job has no use for, and they cost minutes over a warm cache.
      - run: npm ci --prefer-offline --no-audit --no-fund

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

  e2e:
    name: e2e on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - run: npm ci --prefer-offline --no-audit --no-fund

      # The app and its installer are each a download. The version is
      # pinned in the harness, so the key moves when the pin does.
      - uses: actions/cache@v4
        with:
          path: ~/.obsidian-cache
          key: obsidian-${{ runner.os }}-${{ hashFiles('e2e/harness/launch.ts') }}

      # Electron needs the libraries Chromium needs, and Playwright
      # keeps that list.
      - name: system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          npx playwright install-deps chromium
          sudo apt-get install -y xvfb

      - name: e2e
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run e2e

      - name: e2e
        if: runner.os == 'macOS'
        run: npm run e2e

      # The report carries the traces and screenshots the specs
      # attached, so a failure needs nothing else kept.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: e2e-report-${{ matrix.os }}
          path: playwright-report/
          retention-days: 7

name: release

# The Obsidian directory installs a plugin from a release's assets, and
# `main.js` and the engine module are gitignored, so the files it wants
# exist only as build output. This is the one job that builds them for
# anyone but the author.
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the version to raise"
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write
  # A signed asset can be traced back to the commit and the run that
  # built it.
  attestations: write
  id-token: write

jobs:
  # A tag pushed with `GITHUB_TOKEN` starts no workflow run of its own, so a
  # dispatched release cannot hand off to the push trigger. It cuts the tag
  # here and `release` carries on with it.
  #
  # Separate from `release` so that re-running the failed half of a dispatched
  # release does not raise the version a second time.
  tag:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      # `npm version` rewrites the manifest and `versions.json` through
      # version-bump.mjs, which wants nothing installed.
      - id: bump
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version "$BUMP" -m "Release %s"
          git push --follow-tags
          node -p "'tag=' + require('./package.json').version" >> "$GITHUB_OUTPUT"

  release:
    needs: tag
    # `tag` is skipped for a tag push, which is not a failure.
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.tag.outputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.tag.outputs.tag || github.ref_name }}
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm ci

      # `npm version` writes every version number from one place, so a tag
      # that disagrees with one of these files was typed by hand. The
      # Obsidian directory rejects a mismatch.
      - name: Check the tag against the versions
        run: |
          for file in manifest.json package.json; do
            version=$(node -p "require('./$file').version")
            if [ "$version" != "$TAG" ]; then
              echo "$file says $version, the tag says $TAG" >&2
              exit 1
            fi
          done

      # The build checks the module against the manifest's engine version.
      - run: npm run build

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: "main.js, manifest.json, styles.css, fleuron_bg.wasm"

      - name: Attach the plugin to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" main.js manifest.json styles.css fleuron_bg.wasm --clobber

name: release

# The Obsidian directory installs a plugin from a release's assets, and
# `main.js` is gitignored, so the three files it wants exist only as build
# output. This is the one job that builds them for anyone but the author.
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the version to raise"
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write
  # A signed asset can be traced back to the commit and the run that
  # built it.
  attestations: write
  id-token: write

jobs:
  # Main takes changes only through a PR, and the release app is the one
  # actor its ruleset lets past that. A tag the app pushes starts a run of
  # this workflow, and `release` builds it there.
  tag:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v5
        with:
          token: ${{ steps.app.outputs.token }}
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      # `npm version` rewrites the manifest and `versions.json` through
      # version-bump.mjs, which wants nothing installed.
      - env:
          BUMP: ${{ inputs.bump }}
          BOT: ${{ steps.app.outputs.app-slug }}[bot]
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          git config user.name "$BOT"
          git config user.email "$(gh api "/users/$BOT" --jq .id)+$BOT@users.noreply.github.com"
          npm version "$BUMP" -m "Release %s"
          git push --follow-tags

  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm ci

      # `npm version` writes every version number from one place, so a tag
      # that disagrees with one of these files was typed by hand. The
      # Obsidian directory rejects a mismatch.
      - name: Check the tag against the versions
        run: |
          for file in manifest.json package.json; do
            version=$(node -p "require('./$file').version")
            if [ "$version" != "$TAG" ]; then
              echo "$file says $version, the tag says $TAG" >&2
              exit 1
            fi
          done

      # The build checks the module against the manifest's engine version.
      - run: npm run build

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: "main.js, manifest.json, styles.css"

      - name: Attach the plugin to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" main.js manifest.json styles.css --clobber

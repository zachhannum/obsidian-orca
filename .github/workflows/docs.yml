name: docs

on:
  pull_request:
    paths:
      - "docs/**"
      - "design/site.spec.css"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "design/site.spec.css"
      - ".github/workflows/docs.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: docs

jobs:
  build:
    name: build the site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - run: npm ci --prefer-offline --no-audit --no-fund

      - run: npm run lint

      - run: npm run build

      # The suite plays the built page in a browser.
      - run: npx playwright install --with-deps chromium

      - run: npm test

      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          name: site
          path: docs/dist
          retention-days: 1

  deploy:
    name: deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    # The previews write the same branch.
    concurrency:
      group: pages-branch
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: site
          path: docs/dist

      # Pages serves the gh-pages branch. The previews of open pull
      # requests live in its pr-preview folder, which a deploy keeps.
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: docs/dist
          clean-exclude: pr-preview/

      - name: check the live docs
        working-directory: ${{ github.workspace }}
        run: |
          host="$(cat docs/dist/CNAME)"
          for page in "" start/install/; do
            for _ in $(seq 1 30); do
              curl -fsS "https://$host/$page" | grep -q "<title>" && continue 2
              sleep 10
            done
            echo "https://$host/$page did not load"
            exit 1
          done
